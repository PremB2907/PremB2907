name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=PremB2907&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&column=7"
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub trophies"
            git push
          fi
